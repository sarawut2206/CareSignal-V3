  else if(WL.mineFilter==="mine")list=mine; else if(WL.mineFilter==="free")list=free;

  if(mode==="cards") html+=list.length
    ? '<div class="scards">'+list.slice().sort(function(a,b){return (a._due||9e15)-(b._due||9e15)}).map(function(r){return scardHTML(r,dueTxt(r))}).join("")+'</div>'
    : '<div class="card"><div class="empty">ไม่มีงานในกลุ่มนี้</div></div>';
  else html+=dashTable({id:"mine",rows:list,sort:{k:"_due",dir:"asc"},
    empty:rows.length?"ไม่มีงานในกลุ่มนี้":(isClinician()?"ไม่มีงานค้าง — เมื่อผู้ประสานงานส่งเคสมาถึง"+rn+" รายการจะขึ้นที่นี่":"ไม่มีงานค้างในความรับผิดชอบของท่าน — ดูเคสทั้งพอร์ตได้ที่เมนู คิวงาน"),
    rowClass:function(r){return r.overdue?"late":""},
    rowAttr:function(r){return 'data-late="'+(r.overdue?1:0)+'" data-open="'+esc(r.kind)+':'+esc(r.ref_id)+'"'},
    note:"รายการนี้กรองที่ฐานข้อมูลด้วยบัญชีที่ล็อกอิน — ท่านเห็นเฉพาะงานในความรับผิดชอบของท่าน ไม่ใช่การซ่อนไว้ที่หน้าจอ",
    cols:[
      {k:"_due",label:"กำหนด",sortKey:function(r){return r._due},searchKey:function(r){return dueTxt(r).t},
       render:function(r){var d=dueTxt(r);return '<b style="color:'+d.c+'">'+esc(d.t)+'</b><span class="sub">'+esc(thDate(r.due_at).split(" ")[0])+'</span>'}},
      {k:"task",label:"งาน",render:function(r){return esc(r.task||"ทบทวนและดำเนินการ")+(r.unclaimed?' <span class="newtag">ยังไม่มีผู้รับ</span>':'')}},
      {k:"level",label:"ระดับ",w:"110px",sortKey:function(r){return LVR[r.level]==null?9:LVR[r.level]},search:false,render:function(r){return prioPill(r.level)}},
      {k:"pseudonym",label:"รหัส",cls:"id",render:function(r){return esc(r.pseudonym||"—")}},
      {k:"display_name",label:"ผู้เอาประกัน",render:function(r){return esc(r.display_name||"—")}},
      {k:"kind",label:"ชนิด",render:function(r){return r.kind==="referral"?"รายการส่งต่อ":"เคส"}},
      {k:"act",label:"การกระทำ",sort:false,search:false,cls:"act",render:function(r){
        return (r.unclaimed&&r.kind==="referral"?'<button class="pri claim" data-claim="'+esc(r.ref_id)+'">รับเคสนี้</button>':'')+
          '<button data-goopen="'+esc(r.kind)+':'+esc(r.ref_id)+'">'+(r.kind==="case"?"เปิดเคส":"ดูการส่งต่อ")+'</button>';
      }}
    ]});
  V.innerHTML=html+boardGuideHTML(); bindOrgBar();

  function rebind(){
    V.querySelectorAll("[data-claim]").forEach(function(b){
      b.addEventListener("click",async function(e){
        e.stopPropagation();
        b.disabled=true; b.textContent="กำลังรับ…";
        try{ await CSBackend.claimReferral(b.dataset.claim); toast("รับเคสแล้ว"); mineV() }
        catch(err){ toast("รับเคสไม่สำเร็จ: "+(err.message||err)); b.disabled=false; b.textContent="รับเคสนี้" }
      });
    });
    V.querySelectorAll("[data-goopen]").forEach(function(el){
      el.addEventListener("click",function(e){e.stopPropagation();
        var v=el.dataset.goopen.split(":");
        if(v[0]==="case") caseDetailV(v[1]); else go("refer");
      });
    });
  }
  bindDash(rebind); rebind();
  V.querySelectorAll(".stabs [data-f]").forEach(function(b){b.addEventListener("click",function(){
    WL.mineFilter=b.dataset.f||null; mineV();
  })});
  V.querySelectorAll(".stabs [data-view]").forEach(function(b){b.addEventListener("click",function(){
    WL.mineView=b.dataset.view; mineV();
  })});
}

/* ============================================================

   ------------------------------------------------------------
   ใช้กำหนดว่าบัญชีไหนเป็นวิชาชีพใด ซึ่งเป็นตัวกำหนดว่าคนนั้น

var ASSIGNABLE=["care_manager","pharmacist","physio","doctor","nurse","insurer","admin"];
/* ============================================================

function bindInviteUI(reload){
  var mk=document.getElementById("ivMake");
  if(mk)mk.addEventListener("click",async function(){
    var u=(document.getElementById("ivUser").value||"").trim();
    if(!u){ toast("กรอกชื่อผู้ใช้ก่อน"); return }
    mk.disabled=true; mk.textContent="กำลังออกรหัส…";
    try{
      var res=await CSBackend.issueInvite(u,
        document.getElementById("ivRole").value,
        (document.getElementById("ivName").value||"").trim(),
        (document.getElementById("ivNote").value||"").trim(),
        parseInt(document.getElementById("ivDays").value,10)||30);
      /* เก็บไว้ในตัวแปรชั่วคราวเพื่อแสดงต่อ เพราะ reload จะวาดหน้าใหม่ทั้งหน้า */
      ST.lastInvite={u:u,code:res&&res.code};
      toast("ออกรหัสแล้ว");
      if(reload) await reload();
      showLastInvite();
    }catch(e){
      toast("ออกรหัสไม่สำเร็จ: "+(e.message||e));
      mk.disabled=false; mk.textContent="ออกรหัส";
    }
  });
  showLastInvite();
  V.querySelectorAll("[data-revoke]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!confirm("ยกเลิกรหัสนี้?\nผู้ที่ยังไม่ได้ใช้จะใช้รหัสนี้ไม่ได้อีก"))return;
      b.disabled=true;
      try{ await CSBackend.revokeInvite(b.dataset.revoke); toast("ยกเลิกแล้ว"); usersV() }
      catch(e){ toast("ยกเลิกไม่สำเร็จ: "+(e.message||e)); b.disabled=false }
    });
  });
}

/* แสดงรหัสที่เพิ่งออกครั้งเดียว แล้วลบออกจากหน่วยความจำทันทีที่ผู้ดูแลระบบกดรับทราบ */
function showLastInvite(){
  var box=document.getElementById("ivOut"), li=ST.lastInvite;
  if(!box||!li||!li.code)return;
  box.innerHTML='<div class="notice" style="margin:14px 0 0;border-color:var(--c4)">'+
    '<b>รหัสสำหรับ '+esc(li.u)+'</b>'+
    '<div style="font-family:var(--mono);font-size:21px;letter-spacing:.08em;margin:10px 0;'+
    'user-select:all">'+esc(li.code)+'</div>'+
    'คัดลอกหรือจดไว้ตอนนี้ — <b>ปิดหน้านี้แล้วจะไม่เห็นรหัสนี้อีก</b> '+
    'ถ้าทำหายให้ยกเลิกใบนี้แล้วออกใบใหม่'+
    '<div class="btnrow"><button class="ok" id="ivCopy">คัดลอกรหัส</button>'+
    '<button class="no" id="ivDone">จดแล้ว ซ่อนรหัส</button></div></div>';
  document.getElementById("ivCopy").addEventListener("click",function(){
    try{ navigator.clipboard.writeText(li.code); toast("คัดลอกแล้ว") }
    catch(e){ toast("คัดลอกไม่ได้ — จดด้วยมือแทน") }
  });
  document.getElementById("ivDone").addEventListener("click",function(){
    ST.lastInvite=null; box.innerHTML="";
  });
}

/* ============================================================
   จัดการข้อมูลในระบบ (เฉพาะผู้ดูแลระบบ)
   ------------------------------------------------------------
   ระบบเก็บข้อมูลสุขภาพของคนจริง จึงต้องมีทางลบที่เห็นได้และตรวจย้อนได้
   ไม่ใช่ต้องเข้าไปพิมพ์คำสั่งที่หลังบ้านซึ่งไม่มีใครรู้ว่าใครลบอะไร

   สามอย่างที่หน้านี้ไม่ยอมให้ทำ และเหตุผล
     · ลบบันทึกตรวจสอบ — ระบบประกาศกับผู้ใช้ว่าแก้ย้อนหลังไม่ได้
       ถ้าผู้ดูแลระบบลบได้ คำประกาศนั้นก็ไม่จริง
     · ลบบัญชีเจ้าหน้าที่ที่เคยลงมือทำงาน — เคสและรายการส่งต่ออ้างถึงว่า
       ใครเป็นคนทำ ลบทิ้งแล้วจะเหลือประวัติที่ไม่มีผู้รับผิดชอบ
       ใช้ "ถอนสิทธิ์" แทน เข้าระบบไม่ได้อีกแต่ประวัติยังอ้างถึงได้
     · ลบบัญชีของตัวเอง หรือลบผู้ดูแลระบบคนสุดท้าย — จะไม่เหลือใครกู้ระบบ
   ทั้งสามข้อบังคับที่ฐานข้อมูล ไม่ใช่แค่ซ่อนปุ่ม
   ============================================================ */
async function dataV(){
  head("จัดการข้อมูล","ดูว่ามีข้อมูลอะไรอยู่เท่าไร และเลือกลบเป็นรายบัญชี");
  if(ST.role!=="admin"){
    V.innerHTML='<div class="warnbox"><b>หน้านี้เฉพาะผู้ดูแลระบบ</b><br>'+
      'ข้อจำกัดนี้บังคับที่ฐานข้อมูล ไม่ใช่แค่ซ่อนหน้าจอ</div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  var sum=[],accs=[];
  try{ sum=await CSBackend.dataSummary(); accs=await CSBackend.listAccounts() }catch(e){}

  var html='<div class="notice"><b>บันทึกตรวจสอบลบไม่ได้</b> — ทุกการลบในหน้านี้ถูกบันทึกไว้เอง '+
    'พร้อมชื่อผู้ทำและจำนวนที่ลบ · ลบบัญชีแล้วบันทึกเก่าของบัญชีนั้นยังอยู่ครบ '+
    'เพียงแต่ไม่ผูกกับบัญชีที่ถูกลบอีกต่อไป<br>'+
    '<span class="tiny" style="display:block;margin-top:6px">ทะเบียนยาของ อย. เป็นข้อมูลอ้างอิง ไม่ใช่ข้อมูลผู้ใช้ จึงไม่มีปุ่มลบ</span></div>';

  html+='<div class="card"><h3>ข้อมูลในระบบตอนนี้</h3><div class="kpis">'+
    sum.map(function(r){
      return '<div class="kpi" style="cursor:default">'+
        '<b style="color:'+(r.deletable?(r.n?"#fff":"var(--ink3)"):"var(--gold)")+'">'+r.n+'</b>'+
        '<span>'+esc(r.nm)+(r.deletable?"":" · เก็บถาวร")+'</span></div>';
    }).join("")+'</div></div>';

  if(!accs.length){
    html+='<div class="card"><div class="empty">ยังไม่มีบัญชีในระบบ</div></div>';
  }else{
    var mem=accs.filter(function(a){return a.role==="user"});
    var stf=accs.filter(function(a){return a.role!=="user"});
    html+=acctCard("บัญชีผู้เอาประกัน",mem,true)+acctCard("บัญชีเจ้าหน้าที่",stf,false);
  }
  V.innerHTML=html;
  bindDataActions();
}

    rows.map(function(a){
      var nm=a.display_name||a.username||"—";
      var n=a.n_assess+a.n_cases+a.n_meds;
      return '<div class="case">'+
        '<div class="top"><b>'+esc(nm)+'</b>'+
        '<span class="who">'+esc(a.username||"ไม่มีชื่อผู้ใช้")+' · '+esc(ROLE_NM[a.role]||a.role)+'</span>'+
        (a.is_self?'<span style="margin-left:auto;font-size:11.5px;color:var(--gold)">บัญชีของท่าน</span>':'')+
        '</div>'+
        '<div class="rowline"><span class="k">ข้อมูลที่ผูกอยู่</span><span class="v">'+
          'ประเมิน '+a.n_assess+' · เคส '+a.n_cases+' · ยา '+a.n_meds+'</span></div>'+
        '<div class="rowline"><span class="k">สร้างเมื่อ</span><span class="v">'+thDate(a.created_at)+'</span></div>'+
        (a.has_history?'<div class="flag">บัญชีนี้เคยลงมือทำงานในระบบ (ส่งต่อ ทบทวน หรือรับเคส) '+
          'จึงลบไม่ได้ เพราะประวัติเหล่านั้นต้องมีผู้รับผิดชอบ</div>':'')+
        (a.is_self?'' :
          '<div class="btnrow" style="flex-wrap:wrap">'+
          (n?'<button class="no" data-purge="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 100%">ลบข้อมูลสุขภาพ เก็บบัญชีไว้</button>':'')+
          (isMember?'' :'<button class="no" data-revoke2="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 45%">ถอนสิทธิ์</button>')+
          (a.has_history?'' :'<button class="no" data-del="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 45%;color:var(--c1)">ลบบัญชีทั้งหมด</button>')+
          '</div>')+
      '</div>';
    }).join("")+'</div>';
}

/* การลบข้อมูลสุขภาพย้อนกลับไม่ได้ จึงให้พิมพ์ชื่อยืนยัน ไม่ใช่แค่กด ตกลง
   กล่อง confirm กดผ่านด้วยความเคยชินได้ง่ายเกินไปสำหรับการกระทำแบบนี้ */
function askExact(word,what){
  var t=prompt(what+"\n\nพิมพ์ \""+word+"\" เพื่อยืนยัน");
  return t!==null && t.trim()===word;
}
function bindDataActions(){
  V.querySelectorAll("[data-purge]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!askExact("ลบข้อมูล","ลบแบบประเมิน เคส ยา สัญญาณเสี่ยง และคำยินยอมของ "+
        b.dataset.nm+" ทั้งหมด · บัญชียังอยู่ · ย้อนกลับไม่ได้"))return;
      b.disabled=true;
      try{ var c=await CSBackend.purgeMemberData(b.dataset.purge);
        toast("ลบแล้ว "+Object.keys(c).reduce(function(t,k){return t+c[k]},0)+" รายการ"); dataV() }
      catch(e){ toast("ลบไม่สำเร็จ: "+(e.message||e)); b.disabled=false }

function go(sc){
  /* โอเวอร์เลย์บอร์ดอยู่เหนือทุกอย่าง ถ้าไม่ปิดก่อนย้ายหน้า จะบังหน้าถัดไปทั้งหน้า */
  if(WARD.on&&sc!=="ward")wardClose();
  ST.screen=sc;(FN[sc]||loginV)();
  [TABS,SIDE].forEach(function(nav){
    nav.querySelectorAll("[data-go]").forEach(function(b){b.setAttribute("aria-selected",b.dataset.go===sc)});
  });
  window.scrollTo(0,0);
}
[TABS,SIDE].forEach(function(nav){
  nav.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
});

   ต้องใช้ได้ด้วย ไม่งั้นบนมือถือจะกดแล้วไม่เกิดอะไรขึ้น */
V.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");
  if(b&&V.contains(b))go(b.dataset.go);
});
/* ============================================================
   เข้าตรงที่เคส — เทียบเคียงกรณีที่ 1 ของ Health Link
   ------------------------------------------------------------
   ถ้าระบบ HIS มีปุ่ม Health Link แพทย์กดจากหน้าประวัติคนไข้ได้เลย
   ไม่ต้องเลือกคนไข้ใหม่ · ของเรา: ลิงก์ที่ส่งไปกับการแจ้งส่งต่อ
   จะพาผู้เชี่ยวชาญมาที่เคสนั้นโดยตรง ไม่ต้องไล่หาในคิว
   รูปแบบ: ...CareSignal-Staff.html#ref=<รหัสรายการส่งต่อ>
   ============================================================ */
function deepLink(){
  /* รับรหัสสาธิต (0000dem0-…) ด้วย ไม่ใช่เฉพาะเลขฐานสิบหก */
  var m=(location.hash||"").match(/ref=([0-9a-z-]{8,})/i);
  return m?m[1]:null;
}
/* บัญชีบริษัทประกันเห็นเฉพาะภาพรวมระดับกลุ่ม — ซ่อนเมนูรายบุคคลไว้ตั้งแต่แรก
   ไม่ใช่แค่กันตอนกดเข้า เพื่อไม่ให้เข้าใจผิดว่ามีสิทธิ์ */
var NAV_BY_ROLE={
  /* ผู้ประสานงานเห็นทั้งพอร์ตเพราะต้องจัดสรรงานและติดตามภาพรวม */
  care_manager:["ward","mine","queue","call","appt","refer","meds","port","reports","audit","me"],
  admin:       ["ward","mine","queue","call","appt","refer","meds","port","prev","reports","audit","users","creds","data","me"],
  /* บริษัทประกันเห็นเฉพาะภาพรวมระดับกลุ่ม ไม่มีเมนูรายบุคคลเลย */
  insurer:     ["port","prev","me"],
  /* วิชาชีพเห็นเฉพาะงานที่ส่งมาถึงตน ไม่มีคิวรวมทั้งพอร์ต
     เภสัชกรได้หน้าทบทวนยาเพิ่ม เพราะเป็นเครื่องมือของวิชาชีพนั้นโดยตรง */
  pharmacist:  ["mine","refer","appt","meds","cred","me"],
  physio:      ["mine","refer","appt","cred","me"],
  doctor:      ["mine","refer","appt","cred","me"],
  nurse:       ["mine","refer","appt","cred","me"]
};
function navForRole(){
  var allow=NAV_BY_ROLE[ST.role]||["mine","me"];
  [TABS,SIDE].forEach(function(nav){
    nav.querySelectorAll("[data-go]").forEach(function(b){
      b.hidden = allow.indexOf(b.dataset.go)<0;
    });
  });
  SIDE.querySelectorAll(".sgrp").forEach(function(g){
    /* ซ่อนหัวข้อกลุ่มที่ไม่มีปุ่มเหลืออยู่ */
    var vis=0, n=g.nextElementSibling;
    while(n&&n.tagName==="BUTTON"){ if(!n.hidden) vis++; n=n.nextElementSibling }
    g.hidden = vis===0;
  });
}
/* ตัวเลขงานค้างข้างเมนู — เจ้าหน้าที่เห็นภาระงานโดยไม่ต้องกดเข้าไปดู */
async function navCounts(){
  if(ST.role==="insurer"||ST.role==="admin"){
    try{ var pv=await CSBackend.insurerPrevention(); var k=(pv.rows||[]).filter(function(x){return x.decision==="pending"}).length;
         var el=SIDE.querySelector('[data-cnt="prev"]'); if(el){el.textContent=k;el.hidden=!k} }catch(e){}
    if(ST.role==="insurer") return;
  }
  var n={};
  try{ var ap=await CSBackend.listAppointments(); var TCn=window.CSTele;
       n.appt=(ap.rows||[]).filter(function(a){var f=Array.isArray(a.final_reports)?a.final_reports[0]:a.final_reports;
         return (TCn&&TCn.joinWindow(a).open)||(isClinician()&&(a.status==="done"||a.status==="in_call")&&!f)}).length }catch(e){}
  try{ n.mine=(await CSBackend.myWork()).length }catch(e){}
  if(isCoordinator()){
    try{ var c=await CSBackend.caseQueue();
         n.queue=c.filter(function(x){return ["stable","closed"].indexOf(x.status)<0}).length }catch(e){}
    try{ n.meds=(await CSBackend.medReviewQueue()).length }catch(e){}
    try{ n.call=(await CSBackend.callList(0)).rows.length }catch(e){}
  }
  try{ n.refer=(await (isClinician()?CSBackend.myReferrals():CSBackend.listReferralQueue()))
         .filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0}).length }catch(e){}
  Object.keys(n).forEach(function(k){
    var el=SIDE.querySelector('[data-cnt="'+k+'"]');
    if(el&&n[k]>0){ el.textContent=n[k]; el.hidden=false }
  });
}

/* ============================================================
   ออกจากระบบอัตโนมัติ — คอนโซลนี้เปิดข้อมูลสุขภาพรายบุคคล
   ถ้าเดินออกจากโต๊ะแล้วลืมออกจากระบบ คนอื่นจะเปิดดูต่อได้
   ============================================================ */
var IDLE_MIN=20, idleT=null;
function resetIdle(){
  if(!ST.role) return;
  clearTimeout(idleT);
  idleT=setTimeout(async function(){
    try{ await CSBackend.signOut() }catch(e){}
    ST.role=null; ST.email=null; ST.pick=null; chip(); TABS.hidden=true; if(SIDE) SIDE.hidden=true;
    pickV();
    V.insertAdjacentHTML("afterbegin",
      '<div class="warnbox">ออกจากระบบอัตโนมัติ เนื่องจากไม่มีการใช้งานเกิน '+IDLE_MIN+' นาที</div>');
  }, IDLE_MIN*60000);
}
["click","keydown","touchstart","scroll"].forEach(function(ev){
  window.addEventListener(ev, resetIdle, {passive:true});
});

/* ---------- บูต ---------- */
(async function(){
  pickV();
  try{
    var ok=await CSBackend.init();
    if(!ok){V.insertAdjacentHTML("afterbegin",'<div class="warnbox">เชื่อมต่อฐานข้อมูลกลางไม่ได้ — แอปเจ้าหน้าที่ต้องออนไลน์เท่านั้น</div>');return}
    var u=await CSBackend.currentUser();
    if(u){
      var p=await CSBackend.loadProfile();
      if(p&&p.id===u.id&&p.must_set_password){
        /* ค้างอยู่ที่ขั้นตั้งรหัสผ่าน — กลับมาทำต่อได้ ไม่ต้องเข้าใหม่ */
        ST.email=p.username||u.email; ST.name=p.display_name||ST.email; setPwV();
      }else if(p&&p.id===u.id&&mayConsole(p.role)){
        /* ลิงก์เข้าตรงเคส — ถ้ามี #ref=... ให้ไปหน้าติดตามการส่งต่อทันที
           เทียบเคียงกับปุ่ม Health Link ในระบบ HIS ที่พาเข้าตรงหน้าประวัติคนไข้ */
        var dl=deepLink(), tl=(location.hash||"").match(/tele=([0-9a-z-]{8,})/i);
        if(dl) ST.focusRef=dl;
        if(tl) ST.focusTele=tl[1];
        await enterConsole(p.role, p.username||u.email, p.display_name, dl?"refer":tl?"appt":null);
      }else if(p&&p.id===u.id){
        /* บัญชีจริงที่ยังไม่ได้แลกรหัส — ให้กรอกรหัสต่อได้เลย ไม่ต้องล็อกอินใหม่ */
        ST.email=p.username||u.email; ST.name=p.display_name||ST.email; redeemV(ST.email);
      }else{try{await CSBackend.signOut()}catch(e){}}
    }
  }catch(e){}
})();

/* PWA */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
